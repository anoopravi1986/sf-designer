<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="600" fill="#f0f0f0"/>

  <!-- Decorative shapes -->
  <circle cx="100" cy="100" r="50" fill="#ff9999"/>
  <rect x="600" y="400" width="100" height="100" fill="#99ccff"/>
  <polygon points="400,100 450,200 350,200" fill="#ccffcc"/>

  <!-- Editable Text Elements -->
  <text x="50" y="300" font-family="Arial" font-size="32" fill="#ff0000">
    Editable Title
  </text>

  <text x="50" y="360" font-family="Verdana" font-size="24" fill="#333333">
    Subtitle or Description
  </text>

  <text x="50" y="420" font-family="Courier New" font-size="20" fill="#0000ff">
    Additional Notes Here
  </text>

</svg>
