      <div class="relative" #dropdownWrapper>

          <div class="grid grid-cols-3 gap-4 text-center bg-white p-4 rounded">

            <!-- Download -->

            </button>

              </div>
              <span class="text-sm font-medium">Print</span>
            </button>
          
            <!-- Save Design -->
            <button id="save-button" class="flex flex-col items-center justify-center space-y-2 text-black col-span-3 sm:col-span-1">
              <div class="bg-white border border-gray-300 rounded-full p-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="folder-open" class="lucide lucide-folder-open"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
              </div>
              <span class="text-sm font-medium">Save</span>
            </button>
          
          </div>
          
          
        </div>
      </div>
