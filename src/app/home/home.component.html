<!-- Mobile 3-dot menu toggle script -->
<script>
  (function() {
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
    
    const threeDotsBtn = document.getElementById('mobile-three-dots-btn');
    const extraMenu = document.getElementById('mobile-extra-menu');
    
    if (threeDotsBtn && extraMenu) {
      threeDotsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        extraMenu.classList.toggle('hidden');
      });
      
      document.addEventListener('click', (e) => {
        if (!threeDotsBtn.contains(e.target) && !extraMenu.contains(e.target)) {
          extraMenu.classList.add('hidden');
        }
      });
    }
  })();
</script>

<div *ngIf="showLoginPopup && !isLoggedIn"
  class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex justify-center items-center" style="    z-index: 99;display: none;">
  
  <form (submit)="onLogin($event)" class="bg-white rounded p-6 w-[300px] shadow-lg">
    <!-- <p>{showLoginPopup}</p> -->
    <h2 class="text-xl font-semibold mb-4 text-center">Login</h2>
    <input type="email" [(ngModel)]="email" name="email" required placeholder="Email"
      class="w-full mb-3 px-4 py-2 border rounded" />
    <input type="password" [(ngModel)]="password" name="password" required placeholder="Password"
      class="w-full mb-4 px-4 py-2 border rounded" />
    <button type="submit" class="w-full bg-[var(--theme-color)] text-white py-2 rounded hover:bg-[#d02e3a]">
      Login
    </button>
    <!-- <button type="button" (click)="closeLoginPopup()" class="w-full mt-2 text-sm text-gray-600">Cancel</button> -->
  </form>
</div>


<div id="fpd-loader" class="fpd-loader-overlay" style="display: none;">
  <img src="https://www.styleflip.com/cdn/shop/files/styleFlip.png?v=1748540306&width=450" alt="StyleflipLogo" />
  <div class="loader"></div>
  <div class="fpd-pro-loading-text">
    <span>Your design is loading</span>
    <div class="fpd-underline"></div>
  </div>
  <button id="fpd-loader-step-1" class="fpd-loader-step-btn" type="button">Please Click to Continue</button>
  <button id="fpd-loader-step-2" class="fpd-loader-step-btn" type="button" style="display: none;">Load Products</button>
  <button id="fpd-loader-step-3" class="fpd-loader-step-btn" type="button" style="display: none;">Load Overlay Images</button>
  <div id="fpd-loader-final-wait" class="fpd-loader-final-wait" style="display: none;">
    <div class="fpd-loader-final-spinner"></div>
    <div class="fpd-loader-final-text">Loading...</div>
    <div id="fpd-loader-final-countdown" class="fpd-loader-final-countdown">5</div>
  </div>
</div>

    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
"></div>

<div id="title-popup" class="fpd-popup-overlay">
  <div class="fpd-popup-box">

    <!-- Header with title and close button (just like Share dropdown) -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <span class="text-sm font-semibold text-gray-800">Save Your Design</span>
      <button id="close-title-popup-btn" 
              class="w-6 h-6 rounded-full flex items-center justify-center hover:bg-gray-100 transition"
              style="background: transparent; border: none; cursor: pointer;">
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="fpd-popup-body" style="padding: 16px;">
      <input 
        type="text" 
        id="design-title-input" 
        placeholder="Enter design title..." 
        style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; box-sizing: border-box;"
      />
    </div>

    <div class="fpd-popup-footer" style="padding: 12px 16px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end;">
      <button id="save-title-btn" class="fpd-btn-save" style="background: var(--theme-color); color: white; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Save</button>
    </div>

  </div>
</div>
