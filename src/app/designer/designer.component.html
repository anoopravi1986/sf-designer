<div class="p-4">
  <input [(ngModel)]="prompt" class="border p-2" placeholder="Enter prompt..." />
  <button class="ml-2 p-2 bg-blue-500 text-white rounded" (click)="generate()">Generate</button>

  <div class="mt-4" *ngIf="imageUrl">
    <img [src]="imageUrl" alt="Generated Image" class="rounded shadow-md max-w-sm" />
  </div>

  <div *ngIf="response">
    <h3>Gemini Output:</h3>
    <p>{{ response }}</p>
  </div>
</div>
