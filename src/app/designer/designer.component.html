<div class="p-4">
  <input [(ngModel)]="prompt" class="p-2 border" placeholder="Enter prompt..." />
  <button class="p-2 ml-2 text-white bg-blue-500 rounded" (click)="generate()">Generate</button>

  <div class="mt-4" *ngIf="imageUrl">
    <img [src]="imageUrl" alt="Generated Image" class="max-w-sm rounded shadow-md" />
  </div>

  <div *ngIf="response">
    <h3>Gemini Output:</h3>
    <p>{{ response }}</p>
  </div>
</div>
