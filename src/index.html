<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DesignerAngular</title>
  <base href="/">
  <!-- maximum-scale=1/user-scalable=no keeps iOS's native pinch/double-tap
       zoom gesture recognizers from ever engaging on this page. Without
       this, they compete with fabric.js's own canvas drag handlers and the
       .fpd-slider-range touch-action:none fixes below - especially in the
       first few touches right after load, before WebKit's gesture
       recognizers settle into their "fail" state and defer to the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- The CSS for the plugin itself - required -->
  <link rel="stylesheet" type="text/css" href="assets/css/FancyProductDesigner.min.css" />
  <!-- Google Doc fixes — new classes only; does not modify styles.scss -->
  <link rel="stylesheet" type="text/css" href="assets/css/fpd-doc-fixes.css" />
  <!-- Add Text Editor (mobile) — isolated fpd-ate-* classes; does not touch Element Editor -->
  <link rel="stylesheet" type="text/css" href="assets/css/fpd-add-text-editor.css" />
  <!-- Add Text Color panel (mobile) — Shadow scroll + related; new fpd-ate-color-* only -->
  <link rel="stylesheet" type="text/css" href="assets/css/fpd-ate-color-panel.css" />
  <!-- Add Text Editor (desktop) — isolated fpd-dte-*; never touches mobile ate -->
  <link rel="stylesheet" type="text/css" href="assets/css/fpd-desktop-add-text-editor.css" />
  <!-- Element Editor (desktop) — isolated fpd-dee-*; opacity sheet match mobile -->
  <link rel="stylesheet" type="text/css" href="assets/css/fpd-desktop-element-editor.css" />

  <!-- HTML5 canvas library - required -->
  <!-- <link rel="stylesheet" type="text/css" href="assets/css/component-css.css" /> -->
  <script src="assets/js/jquery.min.js" type="text/javascript"></script>
  <script src="assets/js/jquery-ui.min.js" type="text/javascript"></script>
  <script src="assets/js/fabric.min.js" type="text/javascript"></script>
  <script src="assets/js/plugins.js" type="text/javascript"></script>
  <script src="assets/js/FancyProductDesigner.js" type="text/javascript"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-uWBOvJpq1YkO98FDnvM3u2Itl3RKE7bpdd+CqzWaKnM7iAvb3b9v8PC6+jSaFPzYcsmfYYzUcFzE6iEFlp29Tg==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
  <!-- Development version -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

</head>
<body class="sfdesigner-main">

  <app-root></app-root>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    setTimeout(() => {
    lucide.createIcons();
    }, 5000);
  </script>
</body>
</html>
